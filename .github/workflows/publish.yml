name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Publish to Maven Central
      run: ./gradlew publish
      env:
        PAPERCUT_MAVEN_USERNAME: ${{ secrets.PAPERCUT_MAVEN_USERNAME }}
        PAPERCUT_MAVEN_PASSWORD: ${{ secrets.PAPERCUT_MAVEN_PASSWORD }}
        GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
